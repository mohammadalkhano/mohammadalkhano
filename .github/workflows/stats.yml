name: Update README stats cards

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner}}&show_icons=true&theme=dark&hide_border=t
          path: profile/stats.svg
          token: ${{ secrets.GH_PAT }}
          fail_on_error: "true"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner}}&layout=compact&theme=dark&hide_border=trt=10
          path: profile/top-langs.svg
          token: ${{ secrets.GH_PAT }}
          fail_on_error: "true"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actb.com"
          git add profile/*.svg
          git diff --cached --quiet || git "
          git push
